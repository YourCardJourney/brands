# Brands - read every product page on Flipkart every 90 minutes, commit the new
# prices, and publish site/ to GitHub Pages. The repo is public, so Actions
# minutes are free. GitHub's own cron runs hours late, so a cron-job.org job
# fires the repository_dispatch "tick" on time; the crons below are a fallback.
#
# A page that fails to read keeps its last good price (tools/scrape.py), so a
# bad run never blanks the board. If nothing at all could be read the run goes
# red, but the last good data is still published.

name: Refresh

on:
  repository_dispatch:
    types: [tick]
  schedule:
    - cron: "15 0-21/3 * * *"   # with the line below = every 90 min
    - cron: "45 1-22/3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read prices
        id: scrape
        # a push is a page change - publish it as is, no fresh read
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/scrape.py
      - name: Commit prices
        run: |
          git config user.name "brands-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/brands.json site/*/products.json
          git diff --cached --quiet || { git commit -m "Prices $(date -u +'%Y-%m-%d %H:%M') UTC"; git push; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Flag a failed read
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::Flipkart could not be read on this run - the site still shows the last good prices."
          exit 1
