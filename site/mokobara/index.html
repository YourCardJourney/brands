<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mokobara deals – worked out | YourCardJourney Brands</title>
  <meta name="description" content="Every Mokobara deal on Flipkart with the price worked out: listed price, coupon and your card's offer, down to what you pay. Refreshed twice a day.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://brands.yourcardjourney.store/mokobara/">
  <meta property="og:title" content="Mokobara deals – worked out">
  <meta property="og:url" content="https://brands.yourcardjourney.store/mokobara/">
  <meta name="theme-color" content="#c9184a">
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css" />
</head>
<body data-brand="mokobara">
<header class="topbar">
  <div class="topbar-inner">
    <a class="back" href="/" aria-label="All brands">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <a class="brand" href="/">
      <span class="brand-mark" id="mark"></span>
      <span class="brand-text"><small class="brand-tag">YOUR CARD JOURNEY</small><span class="brand-name">Brands</span></span>
    </a>
    <span class="crumb"><span class="glyph" id="brandGlyph"></span><span id="brandName">MOKOBARA</span></span>
  </div>
</header>

<div class="dealbar">
  <div class="dealbar-inner">
    <span class="filter-label">Your card</span>
    <div class="seg" id="cardSeg" role="group" aria-label="Your card"></div>
    <label class="switch coins"><input type="checkbox" id="coinsOn" checked><span class="track"></span><span>SuperCoins</span></label>
  </div>
</div>

<div class="filterbar">
  <div class="chiprow" id="typeRow" role="group" aria-label="Type"></div>
  <div class="chiprow" id="sizeRow" role="group" aria-label="Size" hidden></div>
</div>

<main>

  <div class="board-bar">
    <span class="tally" id="tally"></span>
    <div class="mini-toggles">
      <label class="switch"><input type="checkbox" id="stockOnly" checked><span class="track"></span><span>In stock</span></label>
      <select class="mini" id="sortSel" aria-label="Sort">
        <option value="save">Biggest saving</option>
        <option value="pct">Biggest % off</option>
        <option value="low">Lowest price</option>
        <option value="high">Highest price</option>
      </select>
      <div class="seg tiny" id="viewSeg" role="group" aria-label="Layout">
        <button type="button" data-view="tiles" aria-label="Tiles"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></button>
        <button type="button" data-view="list" aria-label="List"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="3" y="4" width="18" height="3" rx="1.5"/><rect x="3" y="10.5" width="18" height="3" rx="1.5"/><rect x="3" y="17" width="18" height="3" rx="1.5"/></svg></button>
      </div>
    </div>
  </div>

  <section class="grid" id="grid" aria-live="polite"></section>
  <div class="empty" id="empty" hidden><b>Nothing here.</b> Loosen a filter.</div>
</main>

<footer class="foot">
  <span id="footMeta"></span>
  <span class="aff" title="I may earn a small commission if you buy through these links, at no extra cost to you.">Affiliate links</span>
  <span class="by"><img src="/yourcardjourney.png" alt="" onerror="this.style.display='none'">Shared by <a href="https://yourcardjourney.store" target="_blank" rel="noopener">@YourCardJourney</a></span>
</footer>

<script src="/common.js"></script>
<script src="/brand.js"></script>
</body>
</html>
