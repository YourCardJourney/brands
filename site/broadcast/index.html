<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Broadcast | YourCardJourney Brands</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#c9184a">
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css?v=0" />
  <style>
    /* Unlisted composer: pick the deals, copy one WhatsApp-ready message.
       Prices use the coupon each product page shows (never an assumed one). */
    .bc { max-width: 1240px; margin: 0 auto; padding: 14px 24px 40px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 22px; align-items: start; }
    .bc h1 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin: 0 0 2px; }
    .bc .sub { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; }
    .ctl { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; column-gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); }
    .ctl .rowbody { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .pick { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
    .pick li { display: grid; grid-template-columns: 22px 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 12px 8px 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--s1); cursor: pointer; transition: border-color .15s, background .15s, opacity .15s; }
    .pick li.off { opacity: .45; }
    .pick li:not(.off) { border-color: color-mix(in srgb, var(--pri) 28%, var(--line)); }
    .pick input { width: 18px; height: 18px; accent-color: var(--pri); margin: 0; }
    .pick img { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: var(--s2); }
    .pick .t { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pick .m { color: var(--ink-2); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .pick .p { text-align: right; font-variant-numeric: tabular-nums; }
    .pick .p b { display: block; font-size: 16px; font-weight: 800; }
    .pick .p span { font-size: 11.5px; font-weight: 800; color: var(--pri); }
    .side { position: sticky; top: 76px; border: 1px solid var(--line); border-radius: 22px; background: var(--s1); padding: 14px; box-shadow: var(--shadow-1); }
    .side textarea { width: 100%; box-sizing: border-box; min-height: 420px; resize: vertical; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--s2); color: var(--ink); font: 500 12.5px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .side .row { display: flex; gap: 8px; margin-top: 10px; }
    .act { flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 11px 14px; font: 800 14px var(--font, Inter, sans-serif); cursor: pointer; text-decoration: none; transition: transform .12s, background .2s; }
    .act:active { transform: scale(.97); }
    .act.copy { background: var(--pri); color: #fff; }
    .act.copy.done { background: #16a34a; }
    .act.wa { background: #25d366; color: #073b1d; }
    .act svg { width: 17px; height: 17px; }
    .act .ok { display: none; } .act.done .ok { display: block; } .act.done .ic { display: none; }
    .side .meta { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 12px; margin: 0 2px 8px; }
    .side .meta b { color: var(--ink); }
    .tabs { display: flex; margin-bottom: 10px; }
    .tabs button { flex: 1; }
    .pane[hidden] { display: none; }
    .shot { display: block; width: 100%; border-radius: 14px; border: 1px solid var(--line); background: var(--s2); min-height: 240px; max-height: 560px; object-fit: contain; object-position: top; }
    .shot.busy { opacity: .55; transition: opacity .2s; }
    .act.ghost { background: var(--s2); color: var(--ink); border: 1px solid var(--line); }
    @media (max-width: 900px) { .bc { grid-template-columns: 1fr; } .side { position: static; } .side textarea { min-height: 300px; } }
    @media (max-width: 600px) { .bc { padding: 10px 16px 32px; } .ctl { grid-template-columns: 64px minmax(0, 1fr); } .pick li { grid-template-columns: 20px 44px minmax(0, 1fr) auto; gap: 10px; } .pick img { width: 44px; height: 44px; } }
  </style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark" id="mark"></span>
      <span class="brand-name">Brands</span>
    </a>
    <span class="crumb"><span>BROADCAST</span></span>
  </div>
</header>

<div class="bc">
  <section>
    <h1>Mokobara · top deals</h1>
    <p class="sub" id="fresh">Loading…</p>

    <div class="ctl"><span class="rowlabel">Card</span><div class="rowbody seg" id="card"></div></div>
    <div class="ctl"><span class="rowlabel">Discount</span><div class="rowbody" id="min"></div></div>
    <div class="ctl"><span class="rowlabel">Type</span><div class="rowbody" id="type"></div></div>
    <div class="ctl"><span class="rowlabel">Show</span><div class="rowbody" id="top"></div></div>

    <ul class="pick" id="list"></ul>
  </section>

  <aside class="side">
    <div class="seg tabs" id="tabs" role="tablist">
      <button type="button" data-tab="text" aria-pressed="true">Text</button>
      <button type="button" data-tab="image" aria-pressed="false">Image</button>
    </div>
    <div class="pane" id="paneImage" hidden>
      <div class="seg tiny tabs" id="sizes" role="group" aria-label="Picture size">
        <button type="button" data-size="portrait" aria-pressed="true">4:5 · WhatsApp / Insta / X</button>
        <button type="button" data-size="wide" aria-pressed="false">16:9 · X wide</button>
      </div>
      <div class="meta"><span><b id="nImg">0</b> top deals in the picture</span><span id="dims">1080 × 1350</span></div>
      <img class="shot" id="shot" alt="Broadcast picture preview">
      <div class="row">
        <button class="act copy" id="share" type="button">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
          <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          <span id="shareLbl">Share</span>
        </button>
        <a class="act ghost" id="dl" download="mokobara-deals.png" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          Download
        </a>
      </div>
    </div>
    <div class="pane" id="paneText">
    <div class="meta"><span><b id="nSel">0</b> deals in the message</span><span id="nChars"></span></div>
    <textarea id="msg" spellcheck="false" aria-label="WhatsApp message"></textarea>
    <div class="row">
      <button class="act copy" id="copy" type="button">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Copy
      </button>
      <a class="act wa" id="wa" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
        WhatsApp
      </a>
    </div>
    </div>
  </aside>
</div>

<script src="/common.js?v=0"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var inr = BR.inr, esc = BR.esc;
  var state = { card: "HDFC", min: 50, type: "", top: 10, one: true, off: {} };
  var items = [], updated = "";

  function pay(p) { return p.listed - (p.coupon || 0) - (state.card ? (p.banks[state.card] || 0) : 0); }
  function pct(p) { return p.mrp > 0 ? Math.round((p.mrp - pay(p)) / p.mrp * 100) : 0; }

  function chip(label, on, attr, val, count) {
    return '<button type="button" class="chip sm' + (on ? " is-active" : "") + '" ' + attr + '="' + esc(val) + '"><span>' + esc(label) + "</span>" +
      (count != null ? '<span class="count">' + count + "</span>" : "") + "</button>";
  }

  // best-first; "one per model" keeps the cheapest colour of each model+size
  function ranked() {
    var list = items.filter(function (p) { return p.stock && (!state.type || p.type === state.type) && pct(p) >= state.min; });
    list.sort(function (a, b) { return pct(b) - pct(a) || pay(a) - pay(b); });
    if (state.one) {
      var seen = {};
      list = list.filter(function (p) { var k = p.title + "|" + p.size; if (seen[k]) return false; seen[k] = 1; return true; });
    }
    return list.slice(0, state.top);
  }

  function line(p, i) {
    var parts = [];
    if (p.coupon) parts.push("coupon " + inr(p.coupon));
    var b = state.card ? (p.banks[state.card] || 0) : 0;
    if (b) parts.push(state.card + " " + inr(b));
    return (i + 1) + ". *" + p.title + (p.size ? " " + p.size : "") + "*" + (p.colour ? " (" + p.colour + ")" : "") + "\n" +
      "   👉 *" + inr(pay(p)) + "* · " + pct(p) + "% off " + inr(p.mrp) + (parts.length ? "\n   " + parts.join(" + ") : "") + "\n" +
      "   " + p.url;
  }

  function render() {
    var cards = {};
    items.forEach(function (p) { Object.keys(p.banks).forEach(function (c) { cards[c] = (cards[c] || 0) + 1; }); });
    $("card").innerHTML = ["", "HDFC"].concat(Object.keys(cards).filter(function (c) { return c !== "HDFC"; }).sort(function (a, b) { return cards[b] - cards[a]; }))
      .map(function (c) { return '<button type="button" data-card="' + esc(c) + '" aria-pressed="' + (state.card === c) + '">' + (c || "No card") + "</button>"; }).join("");

    var base = items.filter(function (p) { return p.stock && (!state.type || p.type === state.type); });
    $("min").innerHTML = [0, 40, 50, 60, 70].map(function (n) {
      return chip(n ? "≥ " + n + "%" : "Any", state.min === n, "data-min", n, base.filter(function (p) { return pct(p) >= n; }).length);
    }).join("");

    var types = {};
    items.forEach(function (p) { if (p.stock) types[p.type] = (types[p.type] || 0) + 1; });
    $("type").innerHTML = chip("All", !state.type, "data-type", "") +
      Object.keys(types).sort(function (a, b) { return types[b] - types[a]; }).map(function (t) { return chip(t, state.type === t, "data-type", t, types[t]); }).join("");

    $("top").innerHTML = [5, 10, 15, 20].map(function (n) { return chip("Top " + n, state.top === n, "data-top", n); }).join("") +
      chip("One per model", state.one, "data-one", "1");

    var list = ranked();
    $("list").innerHTML = list.map(function (p) {
      var on = !state.off[p.id];
      return '<li class="' + (on ? "" : "off") + '" data-id="' + esc(p.id) + '"><input type="checkbox"' + (on ? " checked" : "") + ' tabindex="-1">' +
        (p.img ? '<img src="' + esc(p.img) + '" alt="" loading="lazy">' : "<span></span>") +
        '<div><div class="t">' + esc(p.title) + (p.size ? " " + esc(p.size) : "") + '</div><div class="m">' + esc(p.colour || p.type) +
        (p.coupon ? " · coupon " + inr(p.coupon) : "") + '</div></div>' +
        '<div class="p"><b>' + inr(pay(p)) + "</b><span>" + pct(p) + "% off</span></div></li>";
    }).join("") || '<li class="off"><span></span><span></span><div class="t">Nothing at this discount — loosen a filter.</div></li>';

    var pick = list.filter(function (p) { return !state.off[p.id]; });
    var head = "🧳 *Mokobara deals on Flipkart*" + (state.card ? " — with " + state.card + " card" : "") + "\n" +
      "Prices worked out: coupon + card offer, live " + BR.ago(updated) + "\n";
    var msg = head + "\n" + pick.map(line).join("\n\n") +
      "\n\nAll deals 👉 https://brands.yourcardjourney.store/mokobara/\nShared by @YourCardJourney";
    $("msg").value = msg;
    $("nSel").textContent = pick.length;
    $("nChars").textContent = msg.length + " chars";
    $("wa").href = "https://wa.me/?text=" + encodeURIComponent(msg);
    picked = pick;
    if (tab === "image") schedule();
  }

  // ---- the picture: same deals, same numbers, drawn on a canvas ----
  // Flipkart's image CDN sends Access-Control-Allow-Origin: *, so the photos
  // can be drawn without tainting the canvas.
  // Standard post sizes: 4:5 sits whole in WhatsApp, Instagram and X on
  // phones; 16:9 is X's uncropped wide card. Each holds a few deals, top first.
  var SIZES = {
    portrait: { W: 1080, H: 1350, cols: 2, n: 4, HEAD: 206, FOOT: 112, label: "4:5 · 4 deals" },
    wide: { W: 1600, H: 900, cols: 3, n: 3, HEAD: 176, FOOT: 100, label: "16:9 · 3 deals" }
  };
  var size = "portrait", tab = "text", picked = [], blob = null, timer = 0, token = 0, imgs = {};
  function load(src) {
    if (!imgs[src]) imgs[src] = new Promise(function (ok) {
      var im = new Image(); im.crossOrigin = "anonymous";
      im.onload = function () { ok(im); }; im.onerror = function () { ok(null); };
      im.src = src;
    });
    return imgs[src];
  }
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function fit(c, text, max) {
    if (c.measureText(text).width <= max) return text;
    while (text.length > 1 && c.measureText(text + "…").width > max) text = text.slice(0, -1);
    return text.trim() + "…";
  }
  function wrap(c, text, max, lines) {
    var out = [], cur = "";
    text.split(" ").forEach(function (w) { var t = cur ? cur + " " + w : w; if (c.measureText(t).width > max && cur) { out.push(cur); cur = w; } else cur = t; });
    if (cur) out.push(cur);
    if (out.length > lines) { out = out.slice(0, lines); out[lines - 1] = fit(c, out[lines - 1] + " …", max); }
    return out;
  }
  function schedule() { clearTimeout(timer); $("shot").classList.add("busy"); timer = setTimeout(draw, 220); }

  function draw() {
    var L = SIZES[size], me = ++token, list = picked.slice(0, L.n);
    $("nImg").textContent = list.length;
    var W = L.W, H = L.H, HEAD = L.HEAD, FOOT = L.FOOT, P = 44, G = 24, PADY = 30, TH = 178;
    var rowsMax = Math.ceil(L.n / L.cols), CW = (W - P * 2 - G * (L.cols - 1)) / L.cols;
    var CH = (H - HEAD - FOOT - PADY * 2 - G * (rowsMax - 1)) / rowsMax, PH = CH - TH;
    Promise.all([document.fonts ? document.fonts.ready : 0, load("/yourcardjourney.png")].concat(list.map(function (p) { return p.img ? load(p.img) : null; })))
      .then(function (got) {
        if (me !== token) return;
        var logo = got[1], photos = got.slice(2);
        var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
        var c = cv.getContext("2d"), F = "Inter, system-ui, sans-serif";
        c.fillStyle = "#fff4f7"; c.fillRect(0, 0, W, H);
        // header band
        var g = c.createLinearGradient(0, 0, W, HEAD); g.addColorStop(0, "#f13ab1"); g.addColorStop(.5, "#ff3f6c"); g.addColorStop(1, "#fd913c");
        c.fillStyle = g; rr(c, 0, -40, W, HEAD + 40, 48); c.fill();
        c.fillStyle = "rgba(255,255,255,.82)"; c.font = "800 22px " + F; c.fillText("FLIPKART  ·  PRICES WORKED OUT", P, HEAD * .28);
        c.fillStyle = "#fff"; c.font = "800 " + Math.round(HEAD * .31) + "px " + F; c.fillText("Mokobara deals", P, HEAD * .62);
        c.font = "600 24px " + F; c.fillStyle = "rgba(255,255,255,.92)";
        c.fillText(fit(c, (state.card ? "With " + state.card + " card" : "No card offer") + "  ·  coupon + card offer included  ·  " +
          new Date(updated).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }), W - P * 2), P, HEAD * .84);
        // one card per deal, numbered like the message; a short last row is centred
        list.forEach(function (p, i) {
          var row = Math.floor(i / L.cols), inRow = Math.min(L.cols, list.length - row * L.cols);
          var x = (W - (inRow * CW + (inRow - 1) * G)) / 2 + (i % L.cols) * (CW + G), y = HEAD + PADY + row * (CH + G);
          c.save(); c.shadowColor = "rgba(201,24,74,.12)"; c.shadowBlur = 30; c.shadowOffsetY = 8;
          c.fillStyle = "#fff"; rr(c, x, y, CW, CH, 30); c.fill(); c.restore();
          var im = photos[i];
          if (im) {
            c.save(); rr(c, x, y, CW, PH, 30); c.clip();
            var k = Math.min((CW - 40) / im.width, (PH - 30) / im.height), w = im.width * k, h = im.height * k;
            c.drawImage(im, x + (CW - w) / 2, y + (PH - h) / 2 + 6, w, h); c.restore();
          }
          c.fillStyle = "#1f1235"; rr(c, x + 18, y + 18, 54, 54, 27); c.fill();
          c.fillStyle = "#fff"; c.font = "800 26px " + F; c.textAlign = "center"; c.fillText(String(i + 1), x + 45, y + 54); c.textAlign = "left";
          var off = pct(p) + "% OFF"; c.font = "800 26px " + F; var ow = c.measureText(off).width + 32;
          c.fillStyle = "#ff3f6c"; rr(c, x + CW - ow - 18, y + 20, ow, 50, 25); c.fill();
          c.fillStyle = "#fff"; c.fillText(off, x + CW - ow - 2, y + 54);
          var ty = y + PH;
          c.fillStyle = "#efe7ee"; c.fillRect(x + 24, ty, CW - 48, 2);
          c.fillStyle = "#1a1320"; c.font = "700 26px " + F;
          c.fillText(fit(c, p.title + (p.size ? " " + p.size : ""), CW - 48), x + 24, ty + 42);
          c.fillStyle = "#7a6f80"; c.font = "500 20px " + F; c.fillText(fit(c, p.colour || p.type, CW - 48), x + 24, ty + 72);
          c.fillStyle = "#c9184a"; c.font = "800 46px " + F; var pr = inr(pay(p)); c.fillText(pr, x + 24, ty + 126);
          var pw = c.measureText(pr).width, mrp = inr(p.mrp); c.fillStyle = "#9a8fa0"; c.font = "500 23px " + F;
          c.fillText(mrp, x + 38 + pw, ty + 124); c.fillRect(x + 38 + pw, ty + 116, c.measureText(mrp).width, 2);
          var bits = [], b = state.card ? (p.banks[state.card] || 0) : 0;
          if (p.coupon) bits.push("Coupon " + inr(p.coupon));
          if (b) bits.push(state.card + " " + inr(b));
          if (bits.length) { c.fillStyle = "#5b3fd6"; c.font = "700 19px " + F; c.fillText(fit(c, bits.join("  +  "), CW - 48), x + 24, ty + 160); }
        });
        var fy = H - FOOT, ls = FOOT - 44, tx = P + (logo ? ls + 22 : 0);
        c.fillStyle = "#1f1235"; c.fillRect(0, fy, W, FOOT);
        if (logo) c.drawImage(logo, P, fy + 22, ls, ls);
        c.fillStyle = "#fff"; c.font = "800 28px " + F; c.fillText("brands.yourcardjourney.store/mokobara", tx, fy + FOOT * .46);
        c.fillStyle = "rgba(255,255,255,.7)"; c.font = "600 20px " + F; c.fillText("Shared by @YourCardJourney  ·  buy links in the message", tx, fy + FOOT * .76);
        cv.toBlob(function (bl) {
          if (me !== token || !bl) return;
          blob = bl;
          var u = URL.createObjectURL(bl), old = $("shot").src;
          $("shot").src = u; $("dl").href = u; $("shot").classList.remove("busy");
          if (old && old.indexOf("blob:") === 0) setTimeout(function () { URL.revokeObjectURL(old); }, 4000);
        }, "image/png");
      });
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-card],button[data-min],button[data-type],button[data-top],button[data-one],li[data-id]");
    if (!b) return;
    if (b.dataset.card != null) state.card = b.dataset.card;
    else if (b.dataset.min != null) state.min = +b.dataset.min;
    else if (b.dataset.type != null) state.type = b.dataset.type;
    else if (b.dataset.top != null) state.top = +b.dataset.top;
    else if (b.dataset.one != null) state.one = !state.one;
    else if (b.dataset.id) state.off[b.dataset.id] = !state.off[b.dataset.id];
    render();
  });
  $("msg").addEventListener("input", function () {
    $("nChars").textContent = this.value.length + " chars";
    $("wa").href = "https://wa.me/?text=" + encodeURIComponent(this.value);
  });
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]"); if (!b) return;
    tab = b.dataset.tab;
    this.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    $("paneText").hidden = tab !== "text"; $("paneImage").hidden = tab !== "image";
    if (tab === "image") schedule();
  });
  $("sizes").addEventListener("click", function (e) {
    var b = e.target.closest("[data-size]"); if (!b) return;
    size = b.dataset.size;
    this.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    $("dims").textContent = SIZES[size].W + " × " + SIZES[size].H;
    schedule();
  });
  // Phones: the share sheet gets the picture with the message as its caption.
  // Laptops: copy the picture, then paste it into WhatsApp Web.
  var canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [new File([""], "x.png", { type: "image/png" })] })); } catch (e) {}
  $("shareLbl").textContent = canShare ? "Share" : "Copy image";
  $("share").addEventListener("click", function () {
    if (!blob) return;
    var btn = this, done = function () { btn.classList.add("done"); setTimeout(function () { btn.classList.remove("done"); }, 1400); };
    if (canShare) {
      navigator.share({ files: [new File([blob], "mokobara-deals.png", { type: "image/png" })], text: $("msg").value }).then(done, function () {});
    } else if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(done, function () { $("dl").click(); });
    } else $("dl").click();
  });
  $("copy").addEventListener("click", function () {
    var btn = this, done = function () { btn.classList.add("done"); setTimeout(function () { btn.classList.remove("done"); }, 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText($("msg").value).then(done, function () { $("msg").select(); document.execCommand("copy"); done(); });
    else { $("msg").select(); document.execCommand("copy"); done(); }
  });

  $("mark").innerHTML = BR.TAG;
  fetch("/mokobara/products.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (d) {
    items = d.items || []; updated = d.updated;
    $("fresh").innerHTML = '<span class="fresh-dot"></span>Prices read from Flipkart ' + BR.ago(updated) + " · every link is our ExtraPe affiliate link";
    render();
  });
})();
</script>
</body>
</html>
